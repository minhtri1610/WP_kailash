version: "3.6"
services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    volumes:
      - ./wp-content:/var/www/html/wp-content
    environment:
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_TABLE_PREFIX=wp_
      # THAY ĐỔI 1: Báo cho WordPress cổng mới
      - WORDPRESS_DB_HOST=db:3376
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=password
    depends_on:
      - db
      - phpmyadmin
    restart: always
    ports:
      - 8080:80

  db:
    image: mysql:latest 
    container_name: wordpress_db
    
    # THAY ĐỔI 2: Ép MySQL chạy ở cổng 3376
    command: --port=3376 
    
    ports:
      # THAY ĐỔI 3: Map cổng 3375 (host) vào 3376 (container)
      - "3375:3376" 

    volumes:
      - db_data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=wordpress
    restart: always

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - 8180:80
    environment:
      PMA_HOST: db
      # THAY ĐỔI 4: Báo cho phpMyAdmin cổng mới
      PMA_PORT: 3376
      MYSQL_ROOT_PASSWORD: password

volumes:
  db_data:
